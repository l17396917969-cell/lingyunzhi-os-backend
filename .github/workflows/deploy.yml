name: Deploy Backend

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Network test
        run: |
          echo "=== Network diagnostics ==="
          nc -zv -w 10 43.142.255.191 22 || true
          ping -c 3 43.142.255.191 || true
          curl -s --connect-timeout 10 http://43.142.255.191/ || true
          echo "=== End diagnostics ==="
        shell: bash

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.SERVER_SSH_KEY }}' | base64 -d > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keygen -l -f ~/.ssh/deploy_key.pem
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@43.142.255.191 << 'REMOTE_EOF'
            set -e
            echo "=== Starting deployment ==="
            cd /home/ubuntu/ontology-platform
            echo "Current dir: $(pwd)"
            git fetch origin
            git reset --hard origin/master
            echo "Git updated"
            docker compose -f docker/compose.prod.yaml up -d --build
            echo "Docker compose done"
            docker compose -f docker/compose.prod.yaml ps
            docker system prune -f
            echo "=== Deployment complete ==="
          REMOTE_EOF
        shell: bash
