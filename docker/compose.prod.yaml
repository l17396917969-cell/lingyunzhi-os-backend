services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onto
      POSTGRES_PASSWORD: ${ONTO_PG_PASSWORD}
      POSTGRES_DB: onto
    volumes:
      - onto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onto -d onto"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APT_MIRROR_HOST: mirrors.tencentyun.com
        PIP_INDEX_URL: https://mirrors.tencentyun.com/pypi/simple/
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTO_DATABASE_URL: postgresql+asyncpg://onto:${ONTO_PG_PASSWORD}@postgres:5432/onto
      ONTO_SECRET_KEY: ${ONTO_SECRET_KEY}
      ONTO_BIND_HOST: 0.0.0.0
      ONTO_BIND_PORT: "8080"
      ONTO_LOG_LEVEL: info
      ONTO_UI_COOKIE_SECURE: "false"
      ONTO_LLM_PROVIDER: ${ONTO_LLM_PROVIDER}
      ONTO_LLM_BASE_URL: ${ONTO_LLM_BASE_URL}
      ONTO_LLM_API_KEY: ${ONTO_LLM_API_KEY}
      ONTO_LLM_MODEL: ${ONTO_LLM_MODEL}
    ports:
      - "80:8080"
      - "10085:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  onto_pg_data:
