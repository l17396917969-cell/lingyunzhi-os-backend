services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onto
      POSTGRES_PASSWORD: onto
      POSTGRES_DB: onto
    volumes:
      - onto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onto -d onto"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTO_DATABASE_URL: postgresql+asyncpg://onto:onto@postgres:5432/onto
      ONTO_SECRET_KEY: ${ONTO_SECRET_KEY}
      ONTO_BIND_HOST: 0.0.0.0
      ONTO_BIND_PORT: "8080"
      ONTO_LOG_LEVEL: info
      ONTO_UI_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onto_pg_data:
